<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Códigos QR</title><link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;font:16px system-ui,sans-serif;color:#1B1F27;background:#fff}
.top{padding:16px;background:#1D2230;color:#fff}.top h1{margin:0;font-size:20px}.top p{margin:4px 0 10px;opacity:.8;font-size:14px}
.top button{padding:10px 16px;border:0;border-radius:10px;background:#CC441B;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:16px}
.card{border:2px solid #1D2230;border-radius:16px;padding:18px;text-align:center;break-inside:avoid}
.card h2{margin:0;font-size:26px}.card .biz{font-size:13px;color:#6B7280;margin-bottom:8px}
.card .q{display:flex;justify-content:center;margin:12px 0}.card .q img,.card .q canvas{max-width:100%}
.card p{margin:0;font-size:14px}.url{word-break:break-all;font-size:11px;color:#6B7280;margin-top:8px}
@media print{.top{display:none}.grid{gap:10px;padding:0}}
</style></head><body>
<div class="top"><h1>Códigos QR del menú</h1><p id="s">Cargando mesas…</p><button onclick="window.print()">Imprimir</button></div>
<div class="grid" id="g"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {FIREBASE_CONFIG} from "./firebase-config.js";
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const base=location.origin+location.pathname.replace(/qr(\.html)?$/,'');
try{
  const db=getFirestore(initializeApp(FIREBASE_CONFIG));
  const s=await getDoc(doc(db,'menu','config'));
  const c=s.exists()?s.data():{biz:'Menú',tables:[]};
  const cards=[{t:'Domicilios',u:base,sub:'Pide a domicilio'}].concat((c.tables||[]).map(t=>({t,u:base+'?mesa='+encodeURIComponent(t),sub:'Escanea y pide desde tu mesa'})));
  document.getElementById('s').textContent=cards.length-1+' mesas + 1 enlace de domicilios. Enlace: '+base;
  document.getElementById('g').innerHTML=cards.map((k,i)=>`<div class="card"><div class="biz">${esc(c.biz||'')}</div><h2>${esc(k.t)}</h2><div class="q" id="q${i}"></div><p>${k.sub}</p><div class="url">${esc(k.u)}</div></div>`).join('');
  cards.forEach((k,i)=>new QRCode(document.getElementById('q'+i),{text:k.u,width:200,height:200,correctLevel:QRCode.CorrectLevel.M}));
}catch(e){document.getElementById('s').textContent='No se pudo cargar. Revisa firebase-config.js y publica el menú desde el POS.'}
</script></body></html>
